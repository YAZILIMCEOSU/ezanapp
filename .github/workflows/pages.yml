name: pages

# Yasal sayfaları (docs/*.html) GitHub Pages'e yayımlar.
# `main` dalına birleştirildiğinde otomatik çalışır; Pages kapalıysa
# configure-pages adımı siteyi etkinleştirmeyi dener.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/build_legal_pages.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Markdown aracını kur
        run: python3 -m pip install --quiet markdown==3.11.3

      - name: Yasal sayfaları üret
        run: python3 tools/build_legal_pages.py

      - name: Bağlantıları doğrula
        run: |
          python3 - <<'PY'
          import os, re, sys
          missing = []
          for name in os.listdir('docs'):
              if not name.endswith('.html'):
                  continue
              page = open(os.path.join('docs', name), encoding='utf-8').read()
              for href in re.findall(r'href="([^"#:]+\.html)"', page):
                  if not os.path.exists(os.path.join('docs', href)):
                      missing.append((name, href))
          if missing:
              print('Kırık bağlantılar:', missing)
              sys.exit(1)
          print('Tüm yasal sayfa bağlantıları geçerli.')
          PY

      - name: Pages'i yapılandır
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Artefaktı yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Yayımla
        id: deployment
        uses: actions/deploy-pages@v4
