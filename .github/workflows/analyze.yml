name: analyze

on:
  workflow_dispatch:
  push:
    branches: [ arena/01a1057d-ezanapp ]
    paths-ignore: [ 'tools/**', 'store/**', '**.md' ]
  pull_request:

concurrency:
  group: analyze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bağımlılıkları yükle
        run: flutter pub get
      - name: Biçim denetimi
        run: dart format --output=none --set-exit-if-changed lib test || true
      - name: Statik analiz
        run: flutter analyze --no-pub
      - name: Testler
        run: flutter test --no-pub --reporter expanded
      - name: Derleme (debug APK)
        run: flutter build apk --debug --no-pub
