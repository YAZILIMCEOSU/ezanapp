name: analyze

on:
  workflow_dispatch:
  push:
    branches: [ arena/01a1057d-ezanapp, main ]
    paths-ignore: [ 'tools/**', 'store/**', '.ci/**', '**.md' ]

concurrency:
  group: analyze-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Gradle 9.3.1 ile uyumlu JDK: runner görüntüsü Java 25'e geçtiğinde
      # derleme "Java/Gradle incompatibility" ile düşmesin.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Yasal sayfalar (docs/*.html) birbirine bağlanır; kırık bağlantı Play/
      # App Store incelemesinde ret sebebidir. Derleme gerektirmeyen hızlı kapı.
      - name: Yasal sayfa bağlantıları
        run: |
          python3 - <<'PY'
          import os, re, sys
          missing = []
          for name in os.listdir('docs'):
              if not name.endswith('.html'):
                  continue
              page = open(os.path.join('docs', name), encoding='utf-8').read()
              for href in re.findall(r'href="([^"#:]+\.html)"', page):
                  if not os.path.exists(os.path.join('docs', href)):
                      missing.append((name, href))
          if missing:
              print('Kırık bağlantılar:', missing)
              sys.exit(1)
          print('Yasal sayfa bağlantıları geçerli.')
          PY

      # Canlı veritabanına bağlanmadan RLS politikalarını denetler: her CRUD
      # politikası var mı, hepsi auth.uid() = user_id koşulunu içeriyor mu,
      # herkese açık (true) politika eklenmiş mi?
      - name: RLS politika denetimi (statik)
        id: rls
        run: set -o pipefail; python3 tools/verify_rls.py 2>&1 | tee /tmp/rls.log

      - name: flutter pub get
        id: pubget
        continue-on-error: true
        run: set -o pipefail; flutter pub get 2>&1 | tee /tmp/pubget.log

      # Lint otomatik düzeltmeleri + biçimlendirme. Değişiklik varsa dala
      # commit'lenir; böylece analiz adımı her zaman biçimli kod üzerinde çalışır.
      - name: dart fix + format (otomatik)
        id: fmt
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "== dart fix --apply =="
            dart fix --apply 2>&1 | tail -40
            echo "== dart format =="
            dart format lib test 2>&1 | tail -20
          } | tee /tmp/fmt.log
          git config user.name "ezanai-ci"
          git config user.email "ci@ezanai.local"
          if ! git diff --quiet; then
            git add -A lib test
            git commit -m "chore(ci): dart fix ve biçimlendirme [skip ci]" || true
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || true
          fi

      - name: flutter analyze
        id: analyze
        continue-on-error: true
        run: set -o pipefail; flutter analyze --no-pub 2>&1 | tail -200 | tee /tmp/analyze.log

      # Vakit zinciri ve arayüz testleri SQLite (sqflite_common_ffi) kullanır;
      # sistem kütüphanesini garanti altına al.
      - name: SQLite sistem kütüphanesi
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev

      - name: flutter test
        id: test
        continue-on-error: true
        run: set -o pipefail; flutter test --no-pub --reporter expanded 2>&1 | tail -400 | tee /tmp/test.log

      # Test keşfi sessizce bozulursa (derleme hatası, yanlış dizin, atlanan
      # dosya) yeşil görünen bir koşu fark edilmesin: alt sınır kapısı.
      - name: Test sayısı kapısı
        id: testcount
        if: steps.test.outcome == 'success'
        run: |
          set -euo pipefail
          count=$(grep -oE '\+[0-9]+' /tmp/test.log | tail -1 | tr -d '+' || true)
          echo "geçen test sayısı: ${count:-0}"
          if [ "${count:-0}" -lt 300 ]; then
            echo "::error::Beklenen en az 300 test; bulunan: ${count:-0}"
            exit 1
          fi

      # Uzak AI sözleşmesi: backend adresi tanımlıyken kaynak zorunluluğu, hata
      # durumunda zarif bozulma ve öneri üretimi doğrulanır.
      # (Aynı dosya normal koşuda atlanır, bkz. test/data/ai_remote_test.dart.)
      - name: flutter test (uzak AI sözleşmesi)
        id: ai
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded \
            --dart-define=EZANAI_API_BASE=https://backend.test \
            test/data/ai_remote_test.dart 2>&1 | tail -120 | tee /tmp/ai.log

      # Kıble doğrulaması: astronomi (güneş), manyetik sapma (WMM-2025),
      # konum hatası bütçesi, uçtan uca zincir ve tutuş füzyonu — 6 bağımsız
      # kontrol. Uygulama kodunu çalıştırmaz; bağımsız kaynaklarla karşılaştırır.
      - name: Kıble doğrulaması (6 kontrol, bağımsız)
        id: kible
        continue-on-error: true
        run: |
          set -o pipefail
          python3 -m pip install --quiet --disable-pip-version-check pygeomag 2>/dev/null || true
          python3 tools/verify_qibla.py 2>&1 | tee /tmp/kible.log

      # Yayın derlemesi yolu: R8 küçültme, kaynak budama, ProGuard kuralları ve
      # gerçek imzalama yapılandırması. Anahtar depoda tutulmaz; burada tek
      # kullanımlık bir deneme anahtarı üretilip doğrulama sonrası atılır.
      - name: flutter build apk (release)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          {
            # SABİT test anahtarı. Her koşuda yeni anahtar üretilirse imza
            # değişir ve Android kurulu uygulamanın üzerine güncelleme yapmaz
            # ("Uygulama yüklenmedi"). Anahtar yalnızca dene-apk içindir;
            # Play yüklemesi release-signed.yml + KEYSTORE_BASE64 ile yapılır.
            cp android/test-only/ezanai-test.p12 "$RUNNER_TEMP/ci-release.p12"
            printf 'storePassword=ezanai-test\nkeyPassword=ezanai-test\nkeyAlias=ezanai-test\nstoreFile=%s\nstoreType=PKCS12\n' \
              "$RUNNER_TEMP/ci-release.p12" > android/key.properties
            flutter build apk --release --no-pub --obfuscate --split-debug-info=build/symbols \
              --dart-define=ADMOB_TEST_MODE=true
            cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ezanai-kurulum.apk
            cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-debug.apk
          } 2>&1 | tail -60 | tee /tmp/build.log

      # İmza doğrulaması: üretilen APK gerçekten imzalı mı, sertifika hangisi?
      # (Kopya koruması için "imza sabitleme" değeri bu çıktıdan alınır.)
      - name: İmza doğrulaması (apksigner)
        id: sign
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT="$(ls -d "$SDK"/build-tools/* 2>/dev/null | tail -1)"
          if [ -z "$BT" ]; then echo "build-tools bulunamadı"; exit 0; fi
          "$BT/apksigner" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk 2>&1 | tee /tmp/sign.log | tail -30

      # Google Play uyumu: hedef API 36 (31 Ağu 2026'dan itibaren zorunlu) ve
      # 16 KB sayfa hizalaması (Android 15+). İkisi de yükleme kapısıdır.
      - name: Play uyum denetimi (API 36 + 16 KB)
        id: playcompliance
        if: always() && steps.build.outcome == 'success'
        run: |
          set -o pipefail
          {
            SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            BT="$(ls -d "$SDK"/build-tools/* 2>/dev/null | tail -1)"
            APK=build/app/outputs/flutter-apk/app-release.apk
            echo "build-tools: $BT"
            "$BT/aapt2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion)" || true
            TARGET="$("$BT/aapt2" dump badging "$APK" | sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p")"
            echo "targetSdkVersion=$TARGET"
            if [ -z "$TARGET" ] || [ "$TARGET" -lt 36 ]; then
              echo "HATA: hedef API ${TARGET:-bilinmiyor} < 36 — Play yüklemesi reddedilir"
              exit 1
            fi
            set +e
            ZIPOUT="$("$BT/zipalign" -c -P 16 -v 4 "$APK" 2>&1)"
            ZIPCODE=$?
            set -e
            echo "$ZIPOUT" | tail -20
            if echo "$ZIPOUT" | grep -qiE "unknown option|unrecognized|invalid option|usage:"; then
              echo "UYARI: zipalign -P desteklenmiyor; 16 KB denetimi atlandı"
            elif [ "$ZIPCODE" -ne 0 ]; then
              echo "HATA: 16 KB sayfa hizalaması başarısız (zipalign çıkış $ZIPCODE)"
              exit 1
            else
              echo "16 KB hizalaması: geçti"
            fi
          } 2>&1 | tee /tmp/playcompliance.log

      # İmza sabitliği: dene-apk her derlemede AYNI sertifikayla imzalanmalı.
      # Aksi hâlde kullanıcı yeni APK'yı eskisinin üzerine kuramaz.
      - name: İmza sabitliği (test anahtarı değişmedi mi?)
        id: sigpin
        if: always() && steps.build.outcome == 'success'
        run: |
          set -o pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT="$(ls -d "$SDK"/build-tools/* 2>/dev/null | tail -1)"
          APK=build/app/outputs/flutter-apk/app-release.apk
          ACTUAL="$("$BT/apksigner" verify --print-certs "$APK" \
            | grep -i "SHA-256 digest" | head -1 \
            | sed 's/.*digest: //' | tr -d ' ' | tr 'A-F' 'a-f')"
          EXPECTED="$(tr -d ' \n' < android/test-only/SHA256.txt)"
          echo "beklenen=$EXPECTED"
          echo "gerçek  =$ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "HATA: deneme APK'sının imzası sabit anahtarla eşleşmiyor."
            exit 1
          fi
          echo "İmza sabit: güncellemeler kurulu uygulamanın üzerine kurulabilir."

      - name: flutter build appbundle (release, deneme anahtarı)
        id: release
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build appbundle --release --no-pub --obfuscate --split-debug-info=build/symbols 2>&1 | tail -80 | tee /tmp/release.log
          status=$?
          rm -f android/key.properties
          exit $status

      # Yedek kurulum dosyası: yalnızca arm64 (neredeyse tüm modern telefonlar).
      # 82 MB'lık genel APK indirilemiyorsa bu ~35 MB'lık dosya kullanılır.
      - name: flutter build apk (arm64, yedek indirme)
        id: arm64
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            printf 'storePassword=ezanai-test\nkeyPassword=ezanai-test\nkeyAlias=ezanai-test\nstoreFile=%s\nstoreType=PKCS12\n' \
              "$GITHUB_WORKSPACE/android/test-only/ezanai-test.p12" > android/key.properties
            flutter build apk --release --no-pub --target-platform android-arm64 \
              --dart-define=ADMOB_TEST_MODE=true 2>&1 | tail -20
            cp build/app/outputs/flutter-apk/app-release.apk \
              build/app/outputs/flutter-apk/ezanai-kurulum-arm64.apk
            build/app/outputs/flutter-apk/ezanai-kurulum-beta.apk
            ls -lh build/app/outputs/flutter-apk/ezanai-kurulum-arm64.apk
            rm -f android/key.properties
          } 2>&1 | tee /tmp/arm64.log

      # KURTARMA PAKETİ: telefonda eski sürüm kuruluysa Android, imza farklı
      # olduğu için güncellemeyi reddeder ("Uygulama yüklenmedi"). Bu paket
      # ayrı kimlikle (com.yazilimceosu.ezanai.beta) derlenir; hiçbir şey
      # silmeden, eskisinin yanına kurulur.
      - name: flutter build apk (beta paketi, çakışmasız kurulum)
        id: beta
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            printf 'storePassword=ezanai-test\nkeyPassword=ezanai-test\nkeyAlias=ezanai-test\nstoreFile=%s\nstoreType=PKCS12\n' \
              "$GITHUB_WORKSPACE/android/test-only/ezanai-test.p12" > android/key.properties
            flutter build apk --release --no-pub \
              -PAPP_ID_SUFFIX=.beta \
              -PAPP_LABEL="Ezan Asistanı Pro (Beta)" \
              --dart-define=ADMOB_TEST_MODE=true 2>&1 | tail -20
            cp build/app/outputs/flutter-apk/app-release.apk \
              build/app/outputs/flutter-apk/ezanai-kurulum-beta.apk
            SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            BT="$(ls -d "$SDK"/build-tools/* 2>/dev/null | tail -1)"
            "$BT/aapt2" dump badging build/app/outputs/flutter-apk/ezanai-kurulum-beta.apk | head -1
            "$BT/apksigner" verify -v build/app/outputs/flutter-apk/ezanai-kurulum-beta.apk 2>&1 \
              | grep -i "verified using" || true
            ls -lh build/app/outputs/flutter-apk/ezanai-kurulum-beta.apk
            rm -f android/key.properties
          } 2>&1 | tee /tmp/beta.log

      # Derleme çıktılarını indirilebilir yap: cihazda denemek için release APK,
      # Play yükleme dosyası biçimi için AAB.
      - name: Derleme çıktılarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ezanai-derlemeleri
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/app/outputs/flutter-apk/ezanai-kurulum.apk
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/ezanai-kurulum-arm64.apk
            build/app/outputs/flutter-apk/ezanai-kurulum-beta.apk
            build/app/outputs/bundle/release/app-release.aab

      # Telefonda denemek için tek tık indirme bağlantısı: imzalı release APK,
      # "dene-apk" adlı GitHub sürümüne hem ezanai-kurulum.apk hem de eski
      # bağlantının bozulmaması için app-debug.apk adıyla eklenir.
      - name: Deneme APK'sını indirmeye aç (sürüm dosyası)
        id: apk_release
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="dene-apk"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "EzanAI — telefonda deneme sürümü (kurulabilir APK)" \
              --notes "Bu dosya yalnızca telefonda denemek içindir; mağazaya yüklenmez. Kurulum: dosyayı indirin, telefonda açın, izin isteyince onaylayın ve kurun."
          fi
          FILES=(
            build/app/outputs/flutter-apk/ezanai-kurulum.apk
            build/app/outputs/flutter-apk/app-debug.apk
          )
          if [ -f build/app/outputs/flutter-apk/ezanai-kurulum-arm64.apk ]; then
            FILES+=(build/app/outputs/flutter-apk/ezanai-kurulum-arm64.apk)
          fi
          if [ -f build/app/outputs/flutter-apk/ezanai-kurulum-beta.apk ]; then
            FILES+=(build/app/outputs/flutter-apk/ezanai-kurulum-beta.apk)
          fi
          gh release upload "$TAG" "${FILES[@]}" --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | "indirmeye hazır: \(.name) (\(.size) bayt)"'

      - name: Raporu yaz
        if: always()
        run: |
          mkdir -p .ci
          {
            echo "# CI raporu ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            echo
            echo "| adım | sonuç |"
            echo "|---|---|"
            echo "| pub get | ${{ steps.pubget.outcome }} |"
            echo "| format | ${{ steps.fmt.outcome }} |"
            echo "| analyze | ${{ steps.analyze.outcome }} |"
            echo "| test | ${{ steps.test.outcome }} |"
            echo "| test sayısı kapısı | ${{ steps.testcount.outcome }} |"
            echo "| test (uzak AI sözleşmesi) | ${{ steps.ai.outcome }} |"
            echo "| RLS politika denetimi | ${{ steps.rls.outcome }} |"
            echo "| kıble doğrulaması (6 kontrol) | ${{ steps.kible.outcome }} |"
            echo "| imza doğrulaması (apksigner) | ${{ steps.sign.outcome }} |"
            echo "| Play uyumu (API 36 + 16 KB) | ${{ steps.playcompliance.outcome }} |"
            echo "| imza sabitliği (test anahtarı) | ${{ steps.sigpin.outcome }} |"
            echo "| build (debug apk) | ${{ steps.build.outcome }} |"
            echo "| build (release appbundle) | ${{ steps.release.outcome }} |"
            echo "| arm64 yedek APK | ${{ steps.arm64.outcome }} |"
            echo "| beta paketi (çakışmasız) | ${{ steps.beta.outcome }} |"
            echo "| dene-apk indirmeye açıldı | ${{ steps.apk_release.outcome }} |"
            for f in pubget fmt analyze test ai rls kible sign sigpin playcompliance build release arm64 beta; do
              if [ -f /tmp/$f.log ]; then
                echo
                echo "## $f"
                echo '```'
                tail -400 /tmp/$f.log
                echo '```'
              fi
            done
          } > .ci/report.md
          cat .ci/report.md
      - name: Raporu commit et
        if: always()
        run: |
          git config user.name "ezanai-ci"
          git config user.email "ci@ezanai.local"
          git add -A .ci
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git commit -m "ci(report): doğrulama sonuçları [skip ci]" || echo "değişiklik yok"
          git push origin HEAD:${{ github.ref_name }} || true
      - name: Adımlardan biri başarısızsa işi düşür
        if: steps.pubget.outcome == 'failure' || steps.analyze.outcome == 'failure' || steps.test.outcome == 'failure' || steps.testcount.outcome == 'failure' || steps.ai.outcome == 'failure' || steps.rls.outcome == 'failure' || steps.kible.outcome == 'failure' || steps.build.outcome == 'failure' || steps.release.outcome == 'failure'
        run: exit 1
