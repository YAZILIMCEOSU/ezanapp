name: ezanai
description: "EzanAI — Akıllı İslam Asistanı: namaz vakitleri, kıble, Kur'an, ilahi, tesbih, hadis, Ramazan ve AI asistan."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Durum yönetimi ve yönlendirme
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2

  # Yerel depolama / önbellek
  shared_preferences: ^2.5.5
  sqflite: ^2.4.4
  path: ^1.9.1
  path_provider: ^2.1.6
  flutter_secure_storage: ^11.2.0

  # Ağ ve konum
  http: ^1.6.0
  geolocator: ^14.1.1
  connectivity_plus: ^7.3.1
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0

  # Bildirimler ve zamanlama
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1

  # Ses (ezan, ilahi, Kur'an)
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  just_audio_background: ^0.0.1-beta.17

  # Arayüz
  fl_chart: ^1.2.0
  intl: ^0.20.3
  scrollable_positioned_list: ^0.3.8
  vibration: ^3.2.1
  file_selector: ^1.0.3
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  collection: ^1.19.1
  uuid: ^4.6.0

  # Ticari özellikler (yapılandırılmadığında devre dışı kalır)
  in_app_purchase: ^3.3.1
  google_mobile_ads: ^9.1.0

  # Bulut (dart-define ile yapılandırıldığında etkinleşir)
  supabase_flutter: ^2.18.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_messaging: ^16.7.0
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0
  firebase_remote_config: ^6.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/
    - assets/data/quran/
    - assets/data/adhkar/
    - assets/audio/adhan/
    - assets/images/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
